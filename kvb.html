
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KVB – Abfahrten</title>

  <style>
    * {
      box-sizing: border-box;
    }


    

    
    body {
      margin: 0;i
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      max-width: 900px;
      margin: 0 auto 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    #aktualisiert {
      color: #64748b;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .haltestelle {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .haltestelle h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .abfahrten {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .abfahrten li {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .linie {
      display: inline-block;
      min-width: 38px;
      padding: 6px 4px;
      border-radius: 7px;
      background: #e2e8f0;
      text-align: center;
      font-weight: bold;
    }

    .info {
      flex: 1;
    }

    .ziel {
      font-weight: 600;
    }

    .zeit {
      color: #475569;
      font-size: 14px;
      margin-top: 3px;
    }

    .status {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🚋 KVB – Abfahrten</h1>
    <p>Linien 4, 18 und 260</p>
    <p id="aktualisiert">Abfahrtsdaten werden vorbereitet …</p>
    <p><a href="./">Zum Köln-Dashboard</a></p>
  </header>

  <main>
    <section class="haltestelle">
      <h2>Köln Dünnwald Leuchterstraße</h2>
      <ul class="abfahrten" id="station-1">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>

    <section class="haltestelle">
      <h2>Köln Deutz Messeplatz</h2>
      <ul class="abfahrten" id="station-2">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>

    <section class="haltestelle">
      <h2>Köln Deutz LANXESS arena</h2>
      <ul class="abfahrten" id="station-3">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>

    <section class="haltestelle">
      <h2>Ebertplatz</h2>
      <ul class="abfahrten" id="station-4">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>
  </main>








<script>
const stationen = [
  { id: "station-1", name: "Köln Dünnwald Leuchterstr." },
  { id: "station-2", name: "Bf Deutz/Messeplatz" },
   { id: "station-3", name: "Bf Deutz/LANXESS arena" },
  
  { id: "station-4", name: "Ebertplatz" }
];

const erlaubteLinien = ["4", "18", "260"];

function uhrzeit(zeitstempel) {
  if (!zeitstempel) return "Zeit unbekannt";

  return new Date(zeitstempel * 1000).toLocaleTimeString("de-DE", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

async function ladeStation(station) {
  const liste = document.getElementById(station.id);
  liste.textContent = "Abfahrten werden geladen …";

  try {
    const url =
      "https://dbf.finalrewind.org/" +
      encodeURIComponent(station.name) +
      ".json?hafas=KVB&version=3";

    const antwort = await fetch(url);

    

    if (!antwort.ok) {
      throw new Error("HTTP " + antwort.status);
    }

    const daten = await antwort.json();

    console.log("API-Antwort:", daten);
console.log("Erster Eintrag:", daten.train?.[0]);




    




const abfahrten = (
  daten.stopEvents ||
  daten.departureList ||
  daten.train ||
  []
)
  .filter(fahrt => {
    const linie = String(
      fahrt.transportation?.disassembledName ||
      fahrt.transportation?.name ||
      fahrt.servingLine?.name ||
      fahrt.train ||
      fahrt.line ||
      ""
    ).replace(/^(Tram|Bus|U-Bahn)\s*/i, "").trim();

    return ["4", "18", "260"].includes(linie);
  })
  .slice(0, 8);
    
    



    


    liste.replaceChildren();

    if (abfahrten.length === 0) {
      liste.textContent =
        "Keine Abfahrten der Linien 4, 18 oder 260 gefunden.";
      return;
    }

    for (const fahrt of abfahrten) {
      const eintrag = document.createElement("li");

      const linie = document.createElement("span");
      linie.className = "linie";
      linie.textContent = fahrt.train;

      const info = document.createElement("div");
      info.className = "info";

      const ziel = document.createElement("div");
      ziel.className = "ziel";
      ziel.textContent = fahrt.destination || "Ziel unbekannt";

      const zeit = document.createElement("div");
      zeit.className = "zeit";

      const abfahrtszeit = fahrt.time || fahrt.scheduledTime;
      zeit.textContent = uhrzeit(abfahrtszeit);

      if (Number(fahrt.delay) > 0) {
        zeit.textContent += " · +" + fahrt.delay + " Min.";
      }

      if (fahrt.isCancelled === true) {
        zeit.textContent += " · Fällt aus";
      }

      info.append(ziel, zeit);
      eintrag.append(linie, info);
      liste.append(eintrag);
    }
  } catch (fehler) {
    liste.textContent = "Abfahrten konnten nicht geladen werden.";
    console.error("Fehler bei " + station.name + ":", fehler);
  }
}

async function ladeAlleStationen() {
  for (const station of stationen) {
    await ladeStation(station);
  }

  document.getElementById("aktualisiert").textContent =
    "Zuletzt aktualisiert: " +
    new Date().toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

ladeAlleStationen();
setInterval(ladeAlleStationen, 60000);
</script>

</body>
</html>



  
</body>
</html>
