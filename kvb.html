
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KVB – Abfahrten</title>

  <style>
    * {
      box-sizing: border-box;
    }


    

    
    body {
      margin: 0;i
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      max-width: 900px;
      margin: 0 auto 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    #aktualisiert {
      color: #64748b;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .haltestelle {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px #0000000d;
    }

    .haltestelle h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .abfahrten {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .abfahrten li {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .linie {
      display: inline-block;
      min-width: 38px;
      padding: 6px 4px;
      border-radius: 7px;
      background: #e2e8f0;
      text-align: center;
      font-weight: bold;
    }

    .info {
      flex: 1;
    }

    .ziel {
      font-weight: 600;
    }

    .zeit {
      color: #475569;
      font-size: 14px;
      margin-top: 3px;
    }

    .status {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🚋 KVB – Abfahrten</h1>
    <p>Linien 4, 18 und 260</p>
    <p id="aktualisiert">Abfahrtsdaten werden vorbereitet …</p>
    <p><a href="./">Zum Köln-Dashboard</a></p>
  </header>

  <main>
    <section class="haltestelle">
      <h2>Köln Dünnwald Leuchterstraße</h2>
      <ul class="abfahrten" id="station-1">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>

    <section class="haltestelle">
      <h2>Köln Deutz Messeplatz</h2>
      <ul class="abfahrten" id="station-2">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>

    <section class="haltestelle">
      <h2>Köln Deutz LANXESS arena</h2>
      <ul class="abfahrten" id="station-3">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>

    <section class="haltestelle">
      <h2>Ebertplatz</h2>
      <ul class="abfahrten" id="station-4">
        <li class="status">Daten werden geladen …</li>
      </ul>
    </section>
  </main>



<script>
const stationen = [
  {
    id: "station-1",
    name: "Köln Dünnwald Leuchterstr."
  },
  {
    id: "station-2",
    name: "Köln Deutz Messeplatz"
  },
  {
    id: "station-3",
    name: "Köln Deutz LANXESS arena"
  },
  {
    id: "station-4",
    name: "Ebertplatz"
  }
];

const erlaubteLinien = ["4", "18", "260"];

async function ladeStation(station) {
  const liste = document.getElementById(station.id);

  try {
    const url =
      "https://dbf.finalrewind.org/" +
      encodeURIComponent(station.name) +
      ".json?hafas=KVB&version=3";

    const antwort = await fetch(url);

    if (!antwort.ok) {
      throw new Error("HTTP " + antwort.status);
    }

    const daten = await antwort.json();

    const abfahrten = (daten.train || [])
      .filter(fahrt => {
        const linie = String(fahrt.line || "")
          .replace(/^(Tram|Bus|U-Bahn)\s*/i, "")
          .trim();

        return erlaubteLinien.includes(linie);
      })
      .slice(0, 8);

    liste.replaceChildren();

    if (abfahrten.length === 0) {
      liste.textContent =
        "Keine passenden Abfahrten gefunden.";
      return;
    }

    for (const fahrt of abfahrten) {
      const li = document.createElement("li");

      const linie = document.createElement("span");
      linie.className = "linie";
      linie.textContent = fahrt.line || "?";

      const info = document.createElement("div");
      info.className = "info";

      const ziel = document.createElement("div");
      ziel.className = "ziel";
      ziel.textContent = fahrt.destination || "Ziel unbekannt";

      const zeit = document.createElement("div");
      zeit.className = "zeit";

      let zeitText = fahrt.time || fahrt.scheduledTime || "";

      if (fahrt.delay) {
        zeitText += " · Verspätung: " + fahrt.delay;
      }

      zeit.textContent = zeitText;
      info.append(ziel, zeit);
      li.append(linie, info);
      liste.appendChild(li);
    }
  } catch (fehler) {
    liste.textContent =
      "Abfahrten konnten nicht geladen werden.";
    console.error(station.name, fehler);
  }
}

async function ladeAlleStationen() {
  await Promise.all(stationen.map(ladeStation));

  document.getElementById("aktualisiert").textContent =
    "Zuletzt aktualisiert: " +
    new Date().toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
}

ladeAlleStationen();
setInterval(ladeAlleStationen, 60000);
</script>
</body>
</html>



  
</body>
</html>
